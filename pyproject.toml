[project]
name = "lnbits-bleskomat"
version = "1.1.0"
requires-python = ">=3.10,<3.14"
description = "LNbits, free and open-source Lightning wallet and accounts system."
authors = [{ name = "Alan Bits", email = "alan@lnbits.com" }]
dependencies = ["lnbits>=1.7.0rc1"]

[dependency-groups]
dev = [
    "black>=24.3.0,<25",
    "pytest-asyncio>=0.21.0,<0.22",
    "pytest>=7.3.2,<8",
    "mypy==1.17.1",
    "pre-commit>=3.2.2,<4",
    "ruff>=0.3.2,<0.4",
    "pytest-md>=0.2.0,<0.3",
]

[tool.uv]
# coincurve 20's source build uses the pre-0.10 scikit-build-core configuration.
build-constraint-dependencies = ["scikit-build-core<0.10"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
# Poetry enforces LNURL's declared upper bound. Use uv for Python 3.13.
python = ">=3.10,<3.13"

[tool.pyright]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs",
    "tests"
]

[tool.mypy]
exclude = "tests"
[[tool.mypy.overrides]]
module = [
  "lnbits.*",
  "lnurl.*",
  "loguru.*",
  "fastapi.*",
  "pydantic.*",
  "pyqrcode.*",
  "shortuuid.*",
  "httpx.*",
]
ignore_missing_imports = "True"

[tool.pytest.ini_options]
log_cli = false
testpaths = [
  "tests"
]

[tool.black]
line-length = 88

[tool.ruff]
# Same as Black. + 10% rule of black
line-length = 88
exclude = [
    "nostr",
]

[tool.ruff.lint]
# Enable:
# F - pyflakes
# E - pycodestyle errors
# W - pycodestyle warnings
# I - isort
# A - flake8-builtins
# C - mccabe
# N - naming
# UP - pyupgrade
# RUF - ruff
# B - bugbear
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# needed for pydantic
[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "root_validator",
    "validator",
]

# Ignore unused imports in __init__.py files.
# [tool.ruff.lint.extend-per-file-ignores]
# "__init__.py" = ["F401", "F403"]

# [tool.ruff.lint.mccabe]
# max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
]
